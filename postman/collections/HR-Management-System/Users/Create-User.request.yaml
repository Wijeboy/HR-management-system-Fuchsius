$kind: http-request
name: Create User
method: POST
url: '{{baseUrl}}/api/users'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "employeeId": "EMP010",
      "name": "John Doe",
      "email": "john@example.com",
      "role": "employee",
      "department": "Engineering",
      "position": "Developer",
      "password": "password123"
    }
